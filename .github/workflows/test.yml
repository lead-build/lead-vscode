name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VS Code's test runner needs a display; xvfb-action provides a
      # virtual one so the extension host can start headlessly.
      - uses: coactions/setup-xvfb@v1
        with:
          run: npm test
